      <text x="405" y="1462" class="mono" fill="#15803d" font-size="14" font-weight="700">get_student_status</text>
      <text x="405" y="1484" class="t" font-size="12">Xem sách đang mượn, đặt trước, quá</text>
      <text x="405" y="1502" class="t" font-size="12">hạn của sinh viên theo mã SV.</text>

      <rect x="730" y="1436" width="330" height="88" rx="10" fill="#ffffff" stroke="#e5e7eb" filter="url(#shadow)"/>
