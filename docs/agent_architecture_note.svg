  <!-- ================================================================ -->
  <g>
    <rect x="40" y="1380" width="1020" height="44" rx="8" fill="#1f2937"/>
    <circle cx="64" cy="1402" r="12" fill="#7c3aed"/>
    <text x="64" y="1407" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">5</text>
