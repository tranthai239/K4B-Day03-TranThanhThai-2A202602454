      <text x="160" y="570" text-anchor="middle" class="m" font-size="12">Kiểm tra SV → tra cứu sách</text>
      <text x="160" y="588" text-anchor="middle" class="m" font-size="12">→ thực hiện nghiệp vụ.</text>

      <rect x="300" y="488" width="240" height="120" rx="10" fill="#ffffff" stroke="#e5e7eb" filter="url(#shadow)"/>
      <text x="420" y="520" text-anchor="middle" font-size="30">🛠️</text>
      <text x="420" y="550" text-anchor="middle" class="t" font-size="13.5" font-weight="700">Tool Interaction</text>
      <text x="420" y="570" text-anchor="middle" class="m" font-size="12">Cần gọi MCP để đọc dữ liệu</text>
      <text x="420" y="588" text-anchor="middle" class="m" font-size="12">thư viện theo thời gian thực.</text>

      <rect x="560" y="488" width="240" height="120" rx="10" fill="#ffffff" stroke="#e5e7eb" filter="url(#shadow)"/>
      <text x="680" y="520" text-anchor="middle" font-size="30">🔀</text>
      <text x="680" y="550" text-anchor="middle" class="t" font-size="13.5" font-weight="700">Dynamic Decision</text>
      <text x="680" y="570" text-anchor="middle" class="m" font-size="12">Quyết định phụ thuộc trạng</text>
      <text x="680" y="588" text-anchor="middle" class="m" font-size="12">thái sách / sinh viên thực tế.</text>

      <rect x="820" y="488" width="240" height="120" rx="10" fill="#ffffff" stroke="#e5e7eb" filter="url(#shadow)"/>
      <text x="940" y="520" text-anchor="middle" font-size="30">🎯</text>
      <text x="940" y="550" text-anchor="middle" class="t" font-size="13.5" font-weight="700">Long Horizon Goal</text>
      <text x="940" y="570" text-anchor="middle" class="m" font-size="12">Duy trì mục tiêu qua nhiều</text>
      <text x="940" y="588" text-anchor="middle" class="m" font-size="12">lượt cho tới kết quả cuối.</text>
    </g>
  </g>

  <!-- ================================================================ -->
  <!-- 3. AGENTIC FIT — 4 TIÊU CHÍ (THANG 5) -->
  <!-- ================================================================ -->
  <g>
    <rect x="40" y="628" width="1020" height="44" rx="8" fill="#1f2937"/>
    <circle cx="64" cy="650" r="12" fill="#d97706"/>
    <text x="64" y="655" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">3</text>
    <text x="88" y="656" fill="#ffffff" font-size="17" font-weight="700">AGENTIC FIT SCORING MATRIX — 4 TIÊU CHÍ (THANG ĐIỂM 5)</text>

    <rect x="40" y="684" width="1020" height="280" rx="10" fill="#ffffff" stroke="#e5e7eb" filter="url(#shadow)"/>

    <!-- Thanh điểm: Multi-step 4/5 -->
    <text x="70" y="724" class="t" font-size="14.5" font-weight="700">1. Multi-step Reasoning</text>
    <rect x="70" y="736" width="600" height="20" rx="10" fill="#eef2f7"/>
    <rect x="70" y="736" width="480" height="20" rx="10" fill="#2563eb"/>
    <text x="690" y="752" class="t" font-size="14" font-weight="700">4 / 5</text>
    <text x="70" y="776" class="m" font-size="12.5">Nhiều bước nối tiếp: xác định sinh viên → kiểm tra trạng thái mượn/đặt trước → thực hiện hành động.</text>

    <!-- Thanh điểm: Tool Interaction 5/5 -->
    <text x="70" y="812" class="t" font-size="14.5" font-weight="700">2. Tool Interaction</text>
    <rect x="70" y="824" width="600" height="20" rx="10" fill="#eef2f7"/>
    <rect x="70" y="824" width="600" height="20" rx="10" fill="#16a34a"/>
    <text x="690" y="840" class="t" font-size="14" font-weight="700">5 / 5</text>
    <text x="70" y="864" class="m" font-size="12.5">Bắt buộc gọi tool bên ngoài để tra cứu sách, trạng thái sinh viên và xử lý nghiệp vụ thư viện.</text>

    <!-- Thanh điểm: Dynamic Decision 4/5 -->
    <text x="70" y="900" class="t" font-size="14.5" font-weight="700">3. Dynamic Decision</text>
    <rect x="70" y="912" width="600" height="20" rx="10" fill="#eef2f7"/>
    <rect x="70" y="912" width="480" height="20" rx="10" fill="#d97706"/>
    <text x="690" y="928" class="t" font-size="14" font-weight="700">4 / 5</text>
    <text x="70" y="952" class="m" font-size="12.5">Quyết định theo trạng thái thực tế: sách còn sẵn hay đã mượn, cần gia hạn hay đặt trước hay không.</text>

    <!-- Tổng điểm -->
    <rect x="760" y="710" width="270" height="220" rx="10" fill="#fef2f2" stroke="#fecaca"/>
    <text x="895" y="746" text-anchor="middle" class="t" font-size="14" font-weight="700">TỔNG ĐIỂM</text>
    <text x="895" y="792" text-anchor="middle" fill="#b91c1c" font-size="40" font-weight="800">17 / 20</text>
    <text x="895" y="826" text-anchor="middle" class="t" font-size="12.5" font-weight="700">4. Long Horizon Goal — 4/5</text>
    <text x="895" y="856" text-anchor="middle" class="m" font-size="12">Duy trì mục tiêu xuyên suốt nhiều</text>
    <text x="895" y="874" text-anchor="middle" class="m" font-size="12">lượt cho tới phản hồi cuối.</text>
    <text x="895" y="908" text-anchor="middle" fill="#16a34a" font-size="13" font-weight="700">✓ &gt; 12/20 ⇒ Phù hợp Agentic</text>
  </g>

  <!-- ================================================================ -->
  <!-- 4. KIẾN TRÚC AGENT -->
  <!-- ================================================================ -->
  <g>
    <rect x="40" y="984" width="1020" height="44" rx="8" fill="#1f2937"/>
    <circle cx="64" cy="1006" r="12" fill="#0d9488"/>
    <text x="64" y="1011" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">4</text>
