      <rect x="385" y="1534" width="330" height="88" rx="10" fill="#ffffff" stroke="#e5e7eb" filter="url(#shadow)"/>
      <rect x="385" y="1534" width="6" height="88" rx="3" fill="#0d9488"/>
      <text x="405" y="1560" class="mono" fill="#0f766e" font-size="14" font-weight="700">reserve_book</text>
