    <!-- Row 1 -->
    <g>
      <rect x="40" y="1436" width="330" height="88" rx="10" fill="#ffffff" stroke="#e5e7eb" filter="url(#shadow)"/>
      <rect x="40" y="1436" width="6" height="88" rx="3" fill="#2563eb"/>
      <text x="60" y="1462" class="mono" fill="#1d4ed8" font-size="14" font-weight="700">library_search</text>
      <text x="60" y="1484" class="t" font-size="12">Tra cứu sách theo mã/tên, vị trí &amp;</text>
      <text x="60" y="1502" class="t" font-size="12">tình trạng mượn/trả của tài liệu.</text>

      <rect x="385" y="1436" width="330" height="88" rx="10" fill="#ffffff" stroke="#e5e7eb" filter="url(#shadow)"/>
