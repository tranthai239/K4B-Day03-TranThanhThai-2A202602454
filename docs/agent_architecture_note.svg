<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1640" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="hdg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7a1f2b"/>
      <stop offset="100%" stop-color="#a93226"/>
    </linearGradient>
    <linearGradient id="agentGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="mcpGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#00000022"/>
    </filter>
    <style>
      .t { fill: #111827; }
      .m { fill: #6b7280; }
      .mono { font-family: Consolas, 'Courier New', monospace; }
    </style>
  </defs>

  <!-- ===== Nền ===== -->
  <rect width="1100" height="1640" fill="#f6f7f9"/>

  <!-- ===== HEADER ===== -->
  <rect x="0" y="0" width="1100" height="140" fill="url(#hdg)"/>
  <text x="550" y="52" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="700">TRỢ LÝ QUẢN LÝ THƯ VIỆN VINUNI — REACT AGENT + MCP</text>
  <text x="550" y="84" text-anchor="middle" fill="#fdecec" font-size="15">Sơ đồ kiến trúc &amp; ghi chú thiết kế · Bài Lab 3: Chatbot vs ReAct Agent</text>
  <text x="550" y="112" text-anchor="middle" fill="#ffffff" font-size="13">Học viên: Trần Thanh Thái · MSSV: 2A202602454 · Khoá 4</text>

  <!-- ================================================================ -->
  <!-- 1. ĐỀ TÀI & LÝ DO -->
  <!-- ================================================================ -->
  <g>
    <rect x="40" y="160" width="1020" height="44" rx="8" fill="#1f2937"/>
    <circle cx="64" cy="182" r="12" fill="#b91c1c"/>
    <text x="64" y="187" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">1</text>
    <text x="88" y="188" fill="#ffffff" font-size="17" font-weight="700">ĐỀ TÀI LỰA CHỌN &amp; LÝ DO</text>

    <rect x="40" y="216" width="500" height="196" rx="10" fill="#ffffff" stroke="#e5e7eb" filter="url(#shadow)"/>
    <rect x="40" y="216" width="500" height="40" rx="10" fill="#fef2f2"/>
    <rect x="40" y="246" width="500" height="10" fill="#fef2f2"/>
    <text x="60" y="242" fill="#b91c1c" font-size="15" font-weight="700">🎯 ĐỀ TÀI ĐÃ CHỌN</text>
    <text x="60" y="292" class="t" font-size="20" font-weight="700">Trợ lý Quản lý Thư viện &amp; Tài liệu</text>
    <text x="60" y="316" class="m" font-size="13">Hỗ trợ sinh viên tra cứu, mượn, trả, gia hạn và</text>
    <text x="60" y="334" class="m" font-size="13">đặt trước tài liệu tại thư viện VinUni.</text>
    <text x="60" y="368" class="t" font-size="13" font-weight="700">Đặc điểm bài toán</text>
    <text x="60" y="388" class="m" font-size="12.5">• Nhiều nghiệp vụ có trình tự nối tiếp nhau.</text>
    <text x="60" y="405" class="m" font-size="12.5">• Cần dữ liệu thời gian thực (tránh ảo giác).</text>

    <rect x="560" y="216" width="500" height="196" rx="10" fill="#ffffff" stroke="#e5e7eb" filter="url(#shadow)"/>
    <rect x="560" y="216" width="500" height="40" rx="10" fill="#eff6ff"/>
    <rect x="560" y="246" width="500" height="10" fill="#eff6ff"/>
    <text x="580" y="242" fill="#2563eb" font-size="15" font-weight="700">💡 VÌ SAO CHỌN ĐỀ TÀI NÀY?</text>
    <text x="580" y="282" class="t" font-size="13.5">Thư viện là tác vụ quen thuộc, đủ nghiệp vụ để</text>
    <text x="580" y="301" class="t" font-size="13.5">minh hoạ trọn vẹn chu trình ReAct mà vẫn dễ</text>
    <text x="580" y="320" class="t" font-size="13.5">kiểm chứng: mỗi bước đều có dữ liệu xác định.</text>
    <text x="580" y="356" class="t" font-size="13.5" font-weight="700">Giá trị Agent mang lại:</text>
    <text x="580" y="378" class="m" font-size="12.5">• Tự chọn đúng tool theo ý định người dùng.</text>
    <text x="580" y="396" class="m" font-size="12.5">• Trả lời dựa trên Observation, không bịa đặt.</text>
  </g>

  <!-- ================================================================ -->
  <!-- 2. VÌ SAO REACT PHÙ HỢP -->
  <!-- ================================================================ -->
  <g>
    <rect x="40" y="432" width="1020" height="44" rx="8" fill="#1f2937"/>
    <circle cx="64" cy="454" r="12" fill="#2563eb"/>
    <text x="64" y="459" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">2</text>
    <text x="88" y="460" fill="#ffffff" font-size="17" font-weight="700">VÌ SAO REACT AGENT PATTERN PHÙ HỢP VỚI BÀI TOÁN NÀY?</text>

    <!-- 4 mini cards -->
    <g>
      <rect x="40" y="488" width="240" height="120" rx="10" fill="#ffffff" stroke="#e5e7eb" filter="url(#shadow)"/>
      <text x="160" y="520" text-anchor="middle" font-size="30">🧩</text>
