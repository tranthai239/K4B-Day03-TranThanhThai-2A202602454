    <rect x="820" y="1212" width="240" height="48" rx="8" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="940" y="1232" text-anchor="middle" class="t" font-size="13" font-weight="700">6 CÔNG CỤ (Tools)</text>
    <text x="940" y="1250" text-anchor="middle" class="m" font-size="11">chi tiết ở mục ⑤ bên dưới</text>
