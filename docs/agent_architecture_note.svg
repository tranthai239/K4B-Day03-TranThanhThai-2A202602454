    <!-- Row 2 -->
    <g>
      <rect x="40" y="1534" width="330" height="88" rx="10" fill="#ffffff" stroke="#e5e7eb" filter="url(#shadow)"/>
      <rect x="40" y="1534" width="6" height="88" rx="3" fill="#b91c1c"/>
      <text x="60" y="1560" class="mono" fill="#b91c1c" font-size="14" font-weight="700">return_book</text>
      <text x="60" y="1582" class="t" font-size="12">Trả sách đã mượn và cập nhật trạng</text>
