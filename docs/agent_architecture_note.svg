    <rect x="290" y="1068" width="470" height="12" fill="url(#agentGrad)"/>
    <text x="525" y="1066" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">REACT AGENT (LLM — Gemini / OpenAI)</text>

    <text x="525" y="1100" text-anchor="middle" class="m" font-size="12">Vòng lặp suy luận Thought → Action → Observation:</text>

    <!-- Thought -->
    <rect x="308" y="1116" width="120" height="56" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="368" y="1140" text-anchor="middle" class="t" font-size="13.5" font-weight="700">🧠 Thought</text>
    <text x="368" y="1158" text-anchor="middle" class="m" font-size="11">Suy luận cần gì</text>

    <!-- Action -->
    <rect x="465" y="1116" width="120" height="56" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="525" y="1140" text-anchor="middle" class="t" font-size="13.5" font-weight="700">⚡ Action</text>
    <text x="525" y="1158" text-anchor="middle" class="m" font-size="11">Gọi tool phù hợp</text>

    <!-- Observation -->
    <rect x="622" y="1116" width="120" height="56" rx="8" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="682" y="1140" text-anchor="middle" class="t" font-size="13.5" font-weight="700">👁️ Observation</text>
    <text x="682" y="1158" text-anchor="middle" class="m" font-size="11">Kết quả từ MCP</text>

    <!-- Arrows between loop nodes -->
    <line x1="428" y1="1144" x2="463" y2="1144" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="585" y1="1144" x2="620" y2="1144" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Return arrow Observation -> Thought -->
    <path d="M682 1172 C 682 1212, 368 1212, 368 1174" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrowRed)"/>
    <text x="525" y="1202" text-anchor="middle" fill="#b91c1c" font-size="11" font-weight="700">Observation quay lại LLM (lặp tới khi có Final Answer)</text>

    <!-- Final Answer -->
    <rect x="455" y="1250" width="150" height="52" rx="8" fill="#16a34a"/>
    <text x="530" y="1272" text-anchor="middle" fill="#ffffff" font-size="13.5" font-weight="700">🏁 Final Answer</text>
    <text x="530" y="1290" text-anchor="middle" fill="#d1fae5" font-size="11">Tổng hợp trả lời</text>
    <line x1="530" y1="1226" x2="530" y2="1248" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Trace note inside agent -->
    <text x="525" y="1326" text-anchor="middle" class="m" font-size="11">📊 Mỗi bước ghi Waterfall Trace (thought · tool · latency thật)</text>

    <!-- Arrow agent -> MCP (tool call) -->
    <line x1="760" y1="1110" x2="812" y2="1110" stroke="#0d9488" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="786" y="1100" text-anchor="middle" class="m" font-size="10.5">tool call</text>
    <!-- Arrow MCP -> agent (result) -->
    <line x1="812" y1="1160" x2="760" y2="1160" stroke="#0d9488" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="786" y="1182" text-anchor="middle" class="m" font-size="10.5">result</text>

    <!-- MCP Server -->
    <rect x="820" y="1050" width="240" height="130" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="2" filter="url(#shadow)"/>
    <rect x="820" y="1050" width="240" height="40" rx="12" fill="url(#mcpGrad)"/>
    <rect x="820" y="1078" width="240" height="12" fill="url(#mcpGrad)"/>
    <text x="940" y="1076" text-anchor="middle" fill="#ffffff" font-size="14.5" font-weight="700">MCP SERVER</text>
    <text x="940" y="1108" text-anchor="middle" class="t" font-size="12">JSON-RPC 2.0 Dispatcher</text>
    <text x="940" y="1128" text-anchor="middle" class="m" font-size="11">Đăng ký &amp; điều phối 6 tool</text>
    <text x="940" y="1148" text-anchor="middle" class="m" font-size="11">Trả Observation cho Agent</text>

    <!-- MCP -> tools box pointer -->
    <line x1="940" y1="1180" x2="940" y2="1208" stroke="#0d9488" stroke-width="2" marker-end="url(#arrow)"/>
